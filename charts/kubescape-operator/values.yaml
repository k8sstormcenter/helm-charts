# Default values for the Kubescape operator chart

# -- Overrides the name of the helm chart
nameOverride: ""
# -- Overrides the full name of the helm chart
fullnameOverride: "kubescape"

# -----------------------------------------------------------------------------------------
# ------------------------------- Basic ---------------------------------------------------
# -----------------------------------------------------------------------------------------

# cluster name: cluster name must be defined by the user!
# --set clusterName=`kubectl config current-context`
clusterName: "cluster"

# The namespace for running the chart
# If you wish to run the chart in a different namespace, make sure to update this value
ksNamespace: kubescape
ksLabel: kubescape

# Additional annotations and labels that should be applied to all resources
additionalAnnotations: {}
additionalLabels: {}

# Certificate handling for the admission webhook and storage mTLS endpoints.
# - `template`     : certs rendered at helm install/upgrade time via Sprig `genSignedCert`. Fastest install, but certs rotate on every `helm upgrade` unless the CA Secret is preserved.
# - `initContainer`: certs generated at runtime by init containers on the consuming pod. GitOps/ArgoCD-safe (no Helm hooks), idempotent across pod restarts, and the CA is reused from a Secret once created.
certificates:
  strategy: template
  certgen:
    image:
      repository: quay.io/kubescape/kubectl
      tag: "1.36.1"
      pullPolicy: IfNotPresent

# global logger name and level
# the logger level and name are mapped to environment variables in each component
logger:
  level: info
  name: zap

# Targeted scanning
# If you wish to exclude specific namespaces from scanning, provide the comma-separated list here
# entlein#8: kubescape is NOT excluded — honey/deception workloads co-located with the stack
# must be traced/learned/detected. node-agent still skips its OWN pods (config.go E1).
excludeNamespaces: "kube-system,kube-public,kube-node-lease,kubeconfig,gmp-system,gmp-public"
# If you wish to scan only specific namespaces, provide the comma-separated list here (takes precedence over excludeNamespaces)
includeNamespaces: ""
# If you wish to exclude workloads having specific labels from scanning, provide them here as a map
excludeLabels:
  # "app.kubernetes.io/component": ["kubescape"]

# Additional volumes applied to all containers
volumes: []

# Additional volumeMounts applied to all containers
volumeMounts: []

customScheduling:
  affinity:
    # Specify affinity rules here
  nodeSelector:
    # Define nodeSelector rules here
  tolerations:
    # Set tolerations for nodes here
  priorityClassName: ""

# -- reference to an exsiting image pull secret for private registry support.
# -- can be used in conjunction with `imagePullSecret` below to generate a secret with provided credentials
imagePullSecrets: ""

# -- (optional) generate image pull secret with the provided credentials. Secret name must be provided in the imagePullSecrets field
# -- must pass in server, username, and password for the secret to be generated
imagePullSecret:
  server: ""
  username: ""
  password: ""
  email: ""

# -----------------------------------------------------------------------------------------
# --------------------------- Capabilities ------------------------------------------------
# -----------------------------------------------------------------------------------------

capabilities:
  # ====== Base operator ======
  operator: enable

  # ====== Image vulnerabilities scanning related capabilities ======
  #
  nodeSbomGeneration: enable # Warning: When disabled along with enableClusterWideSecretAccess: false, vulnerability scanning capabilities will be limited
  # Instruct Syft to also scan for SBOM files in the filesystem container
  scanEmbeddedSBOMs: disable

  # ====== Runtime related capabilities ======
  #
  runtimeObservability: enable
  networkPolicyService: enable
  runtimeDetection: disable
  malwareDetection: disable
  admissionController: enable
  httpDetection: enable
  hostProfileService: disable
  seccompProfileService: enable
  # Storage backend for SeccompProfile resources: "crd" (Kubernetes CRD) or "storage" (aggregated API)
  seccompProfileBackend: crd
  syncSBOM: disable

  # ====== Other capabilities ======
  #
  # This is an experimental capability with an elevated security risk. Read the
  # matching docs before enabling.
  autoUpgrading: disable
  # seccompGenerator: disable

  testing:
    nodeAgentMultiplication:
      enabled: false
      replicas: 5

serviceScanConfig:
  enabled: false
  interval: 1h

configurations:
  otelUrl: # default is empty
  persistence: enable

  # Enable Prometheus annotations, to allow open-source Prometheus (not operator) to scrape metrics
  prometheusAnnotations: disable

  priorityClass:
    enabled: true
    daemonset: 100000100 # PriorityClass value for the node-agent DaemonSet; higher than other components so it schedules on all nodes. Override the name via nodeAgent.priorityClassName.

  # List of json paths to exclude from the pod spec hash computation - used for aggregating CronJob generated CRDs
  excludeJsonPaths:
    # - ".containers[*].env[?(@.name==\"DD_INJECT_ID\")]"

# installation of the alertCRD chart
alertCRD:
  installDefault: false # install the default CRD
  scopeClustered: true # it is better to have the CRDs in the cluster scope
  scopeNamespaced: false # enable scopeNamespaced when there are no permissions for creating cluster scoped CRDs

# -----------------------------------------------------------------------------------------
# ------------------------ Cloud Providers ------------------------------------------------
# -----------------------------------------------------------------------------------------

# It is recommended to setup the cloud info when installing the chart on a managed cluster, this will enable to check the related settings
# cloud support
cloudProviderMetadata:
  # -- AWS IAM arn role
  awsIamRoleArn:

  # -- GKE service account
  gkeServiceAccount:

# -----------------------------------------------------------------------------------------
# ------------------------- Configurations ------------------------------------------------
# -----------------------------------------------------------------------------------------

# Enable persistence using Persistent Volume Claims
persistence:
  # -- persistence storage class
  #    ref: https://kubernetes.io/docs/concepts/storage/storage-classes/
  #    note: set to "-" (dash) for default storage class
  storageClass: "-"

  # -- persistence access mode
  #    ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes
  accessMode: ReadWriteOnce

  # -- persistence size
  size:
    backingStorage: 5Gi

global:
  httpsProxy: ""
  noProxy: ""
  proxySecretFile: "" # file content (not file path), e.g. `global.proxySecretFile=(cat /path/to/file)`
  proxySecretName: kubescape-proxy-certificate
  enableClusterWideSecretAccess: true
  namespaceTier: ks-control-plane
  cloudConfig: ks-cloud-config
  proxySecretDirectory: proxy-support
  configMapsDirectory: configs
  kubescapePsp:
    name: ks-allow-privileged
    enabled: false
  networkPolicy:
    enabled: false
    createEgressRules: false
    apiServerIP: ""
    apiServerPort: 443
    httpsProxyIP: ""
    httpsProxyPort: ""
  overrideRuntimePath: ""
  overrideDefaultCaCertificates:
    enabled: false
    caCertificates: ""
  extraCaCertificates:
    enabled: false
    secretName: ""
  openshift: # Openshift Security Context Constraint support
    scc:
      enabled: false

# -----------------------------------------------------------------------------------------
# ----------------------- Microservices - core --------------------------------------------
# -----------------------------------------------------------------------------------------

# +++++++++++++++++++++++++++++++ Operator ++++++++++++++++++++++++++++++++++++++++++++++++

operator:
  # operator Deployment name
  name: operator

  image:
    # -- source code: https://github.com/kubescape/operator
    repository: quay.io/kubescape/operator
    tag: v0.2.162
    pullPolicy: IfNotPresent

  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  service:
    type: ClusterIP
    port: 4002
    targetPort: 4002
    protocol: TCP
    annotations: {}

  # DEPRECATED: use operator.admissionWebhooks.service.* instead.
  # If any key under admissionService is set, it takes precedence over the matching
  # key under admissionWebhooks.service for backward compatibility.
  # This block will be removed in a future release.
  admissionService: {}
  #   type: ClusterIP
  #   port: 443
  #   targetPort: 8443
  #   annotations: {}

  admissionWebhooks:
    service:
      type: ClusterIP
      port: 443
      targetPort: 8443
      annotations: {}
    patch:
      retries: 60
      retryIntervalSeconds: 5

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 300Mi
  env: {}

  # Additional volumes to be mounted on the websocket
  volumes: []

  # Additional volumeMounts to be mounted on the websocket
  volumeMounts: []

# +++++++++++++++++++++++++++++++ Unittest ++++++++++++++++++++++++++++++++++++++++++++++++
unittest: false
# +++++++++++++++++++++++++++++++ Kubevuln ++++++++++++++++++++++++++++++++++++++++++++++++

kubevuln:
  config:
    maxImageSize: 5368709120 # set the maximum image size for scanning. This refers to the size of the zipped image. If the size of the non-zipped image is larger, increase the ephemeral-storage limits. It is recommended to use the same size as the requested ephemeral-storage
    maxSBOMSize: 20971520
    storeFilteredSboms: false

# +++++++++++++++++++++++++++++++ Storage ++++++++++++++++++++++++++++++++++++++++++++++++

# Values for the Kubescape Storage service that Kubescape uses for its internal
# purposes like storage
storage:
  # Values or the Aggregated APIServer
  name: "storage"
  enabled: true
  mtls:
    enabled: true
    certificateValidityInDays: 730 # NOTE: only in effect when certificates.strategy is "template"
    certgen:
      retries: 60
      retryIntervalSeconds: 5
  serverPort: 8443
  # -- Bind the storage APIServer to the host network. Required when using a custom CNI where the control plane cannot reach pod IPs
  hostNetwork: false
  service:
    type: ClusterIP
    annotations: {}

  # -- source code: https://github.com/kubescape/storage
  image:
    repository: ghcr.io/k8sstormcenter/storage
    tag: m3-acd5fefd
    digest: sha256:61fb57fcefbce088a818f45801b19137b6f12763906f2b48cd3d0e0fb4a11e8e
    pullPolicy: IfNotPresent

  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  # cleanup interval is a duration string
  cleanupInterval: "6h"

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 400Mi
    limits:
      cpu: 1500m
      memory: 1500Mi

  disableVirtualCRDs: false # set to true or false to override auto-detection

  # -- queue manager configuration
  queueManagerEnabled: true # set to false to disable the queue manager, this will disable the queue manager for all kinds
  defaultQueueLength: 100
  defaultWorkerCount: 2
  defaultMaxObjectSize: 400000 # in bytes, this is the maximum size of an object that can be stored in the storage service
  kindQueues:
    # -- set the queues for the different kinds, the default is to use the default queue length and worker count
    containerprofiles:
      queueLength: 50
      workerCount: 2
      maxObjectSize: 2500000
    sbomsyftfiltereds:
      queueLength: 50
      workerCount: 1
      maxObjectSize: 50000000
    sbomsyfts:
      queueLength: 50
      workerCount: 1
      maxObjectSize: 100000000

# +++++++++++++++++++++++++++++ Node-agent ++++++++++++++++++++++++++++++++++++++++++++++++

nodeAgent:
  name: node-agent
  # GOMEMLIMIT as a fraction of resources.limits.memory. 0.8 = 80%.
  # Lower values give the runtime more headroom; raise toward 1.0 only if
  # GC is not aggressive enough.
  gomemlimitPercentage: 0.8
  image:
    # PRIVATE image: installs require an image pull secret — set
    # imagePullSecrets (and optionally the imagePullSecret generator) with
    # docker.io credentials authorized for entlein/duckling.
    repository: docker.io/entlein/duckling
    tag: v0.1.0-m3-0f2f7afe
    digest: sha256:125e2882f0322051a53a0f201c640db00f370563c99b8ac9456624f98710670e
    pullPolicy: IfNotPresent

  # Root-signed trust policy for signed-bundle (SBoB) overlays: mounts the
  # bundle-policy ConfigMap at /etc/bundle and points the agent at it. Without
  # it bundle overlays stay disabled and label-bound workloads never assemble
  # their composite profile (bound-but-never-healed).
  bundleTrustPolicy:
    enabled: true

  directAlerts:
    enabled: true
    port: 50405
    windowBytes: 67108864
    jwtPublicKeySecret: node-agent-direct-jwt-pub
    consumerNamespace: ""
    keygen:
      enabled: true
      ttlSecondsAfterFinished: 300

  config:
    maxLearningPeriod: 24h # duration string
    learningPeriod: 2m # duration string
    updatePeriod: 10m # duration string
    hostProfileUpdatePeriod: 30m # duration string
    # Builds the agent's counters AND starts its /metrics endpoint on :8080.
    # Scrape it with nodeAgent.serviceMonitor.enabled=true where a Prometheus
    # operator is installed, or with the pod annotations of your own scraper.
    prometheusExporter: enable
    alertManagerExporterUrls: []
    stdoutExporter: true
    syslogExporterURL: ""
    skipKernelVersionCheck: false
    malwareScanAllFiles: false
    hostMalwareSensor: disable
    hostNetworkSensor: disable
    dnsReportFailures: true
    nestedContainers:
      enabled: false
      rules: [R0010, R1002, R1004, R1005, R1006, R1015, R1032]
    ruleCooldown:
      ruleCooldownDuration: 1h # duration string
      ruleCooldownAfterCount: 1
      ruleCooldownOnProfileFailure: true
      ruleCooldownMaxSize: 20000
    alertDeduplication:
      bypass: true # sensor-side dedup and cooldown stay off: suppression belongs at display time, never at the sensor
    scanFailureReporting: false
    suggester:
      enabled: false
      bobctlPath: /usr/bin/bobctl
      timeout: 60s
      mode: whole
      defaultBundle: ""
      workDir: /tmp/suggester
      queueSize: 64
      maxPerMinute: 10
      eventInterval: 10m
      delta:
        enabled: false
        expiry: 24h
        argsLiteralCap: 3
      peers:
        enabled: false
        crossNamespace: false
      scope: network
    # Host sensor configuration
    hostSensor:
      enabled: true
      interval: 5m # duration string

  # GKE Autopilot allowlist
  gke:
    allowlist:
      # When enabled, the node-agent is labeled to match `name`, AND the chart installs an
      # AllowlistSynchronizer that pulls that allowlist from Google's managed repo into the cluster.
      enabled: false
      name: armo-kubescape-node-agent-1.40-v2
      # AllowlistSynchronizer path. Leave empty to derive it from `name`
      # (ARMO/<name-without-version-suffix>/*); set explicitly to override.
      path: ""

  # prometheus (operator) service monitor
  serviceMonitor:
    # -- enable/disable service monitor for prometheus
    enabled: false

    # -- Customize prometheus interval and scrapeTimeout
    interval: 30s
    scrapeTimeout: 15s

    # Additional labels, e.g. setting a label for service monitor selector as set in prometheus
    additionalLabels: {}

  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 180Mi
    limits:
      cpu: 500m
      memory: 1400Mi

  env:
    - name: NodeName
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  privileged: false
  seLinuxType: spc_t

  volumeMounts:
    - mountPath: /host
      name: host
      readOnly: true
    - mountPath: /var/lib/kubelet
      name: kubeletdir
    - mountPath: /run
      name: run
      # readOnly: false # Must be writable for the node-agent to open container runtime socket for writing
    - mountPath: /var
      name: var
      readOnly: true
    - mountPath: /lib/modules
      name: modules
      readOnly: true
    - mountPath: /sys/kernel/debug
      name: debugfs
      # readOnly: false # Must be writable for the node-agent to load eBPF programs
    - mountPath: /sys/fs/cgroup
      name: cgroup
      readOnly: true
    - mountPath: /sys/fs/bpf
      name: bpffs
      # readOnly: false # Must be writable for the node-agent to load eBPF programs
    - mountPath: /data
      name: data
      # readOnly: false # EmptyDir volume
    - mountPath: /profiles
      name: profiles
      # readOnly: false # EmptyDir volume
    - mountPath: /boot
      name: boot
      readOnly: true
    - mountPath: /clamav
      name: clamrun
      # readOnly: false # EmptyDir volume
  volumes:
    - hostPath:
        path: /
      name: host
    - hostPath:
        path: /var/lib/kubelet
      name: kubeletdir
    - hostPath:
        path: /run
      name: run
    - hostPath:
        path: /var
      name: var
    - hostPath:
        path: /sys/fs/cgroup
      name: cgroup
    - hostPath:
        path: /lib/modules
      name: modules
    - hostPath:
        path: /sys/fs/bpf
      name: bpffs
    - hostPath:
        path: /sys/kernel/debug
      name: debugfs
    - hostPath:
        path: /boot
      name: boot
    - emptyDir:
      name: data
    - emptyDir:
      name: profiles
    - hostPath:
        path: /
        type: Directory
      name: host-filesystem

  # Note: when the autoscaler is enabled, this affinity is honoured for normal
  # (instance-type) node groups, but the synthetic "default" group of nodes
  # missing the grouping label is targeted with an operator-managed
  # "DoesNotExist" node affinity instead, so this value does not apply to it.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux

  nodeSelector:
    kubernetes.io/os: linux

  startupJitterContainer:
    enabled: false
    maxStartupJitter: 60
    image:
      repository: busybox
      tag: latest

  multipleDaemonSets:
    enabled: false # set to true to enable multiple DaemonSets for the node-agent, with different configurations.
    configurations:
    # - nodeSelector:
    #     kubernetes.io/os: linux
    #   resources:
    #     requests:
    #       cpu: 100m
    #       memory: 180Mi
    #     limits:
    #       cpu: 500m
    #       memory: 1400Mi
    #
    # uncomment when enabled and add more configurations as needed

  # Node agent autoscaler - dynamically creates and sizes DaemonSets based on node groups
  autoscaler:
    # -- enable/disable autoscaler mode
    enabled: false
    # -- node label used to group nodes (each unique value creates a separate DaemonSet)
    nodeGroupLabel: "node.kubernetes.io/instance-type"
    # -- resource percentages relative to node allocatable resources
    resourcePercentages:
      requestCPU: 2      # % of node allocatable CPU for requests
      requestMemory: 2   # % of node allocatable memory for requests
      limitCPU: 5        # % of node allocatable CPU for limits
      limitMemory: 5     # % of node allocatable memory for limits
    # -- minimum resources regardless of node size
    minResources:
      cpu: 100m
      # Note: when `capabilities.nodeSbomGeneration` is enabled, this minimum memory will be bumped to 600Mi (unless changed)
      memory: 180Mi
    # -- maximum resources regardless of node size
    maxResources:
      cpu: 2000m
      memory: 4Gi
    # -- interval for reconciliation loop
    reconcileInterval: 5m
    # -- auto-detect AWS Bottlerocket nodes and set seLinuxType: super_t on their rendered DaemonSets
    bottlerocketAutoDetect: true

  priorityClassName: ""

  # SBOM scanner sidecar — runs Syft in a separate container for memory isolation
  sbomScanner:
    enabled: false
    name: sbom-scanner
    image:
      # Same image as node-agent — shared pull, different entrypoint
      repository: quay.io/kubescape/node-agent
      tag: ""
      pullPolicy: IfNotPresent
    command: ["/usr/bin/sbom-scanner"]
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 4Gi
    volumeMounts:
      - mountPath: /sbom-comm
        name: sbom-comm
      - mountPath: /host
        name: host
        readOnly: true
      # Syft's Java cataloger needs writable temp space to process JAR archives
      - mountPath: /tmp
        name: sbom-scanner-tmp
    volumes:
      - name: sbom-comm
        emptyDir:
          medium: Memory
          sizeLimit: 10Mi
      - name: sbom-scanner-tmp
        emptyDir: {}

# +++++++++++++++++++++++++++++++ ClamAV ++++++++++++++++++++++++++++++++++++++++++++++++
clamav:
  name: clamav
  image:
    # -- source code: https://github.com/kubescape/node-agent/tree/main/clamav
    repository: quay.io/kubescape/klamav
    tag: 1.3.1-34_alpha
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  volumeMounts:
    - mountPath: /var/lib/clamav-tmp
      name: clamdb
      # readOnly: false
    - mountPath: /run/clamav
      name: clamrun
      # readOnly: false
    - mountPath: /etc/clamav
      name: etc
      readOnly: true

  volumes:
    - name: clamdb
      emptyDir: {}
    - name: clamrun
      emptyDir: {}
    - name: etc
      configMap:
        name: clamav
        items:
          - key: clamd.conf
            path: clamd.conf
          - key: freshclam.conf
            path: freshclam.conf

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux

  nodeSelector:
    kubernetes.io/os: linux
# -----------------------------------------------------------------------------------------
# ------------------------ Microservice - helpers -----------------------------------------
# -----------------------------------------------------------------------------------------

# +++++++++++++++++++++++++++++ Upgrader ++++++++++++++++++++++++++++++++++++++++++++++++

# Configures the Helm Release Upgrader
helmReleaseUpgrader:
  name: "helm-release-upgrader"
  image:
    repository: quay.io/kubescape/helm-release-upgrader
    tag: v0.1.0
    pullPolicy: IfNotPresent

  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: ""

  # A cron schedule of how often the updating CronJob should run
  schedule: "0 14 * * *"

  # Resource requests and limits for the CronJob
  resources:
    # Requests and Limits are the same to make the CronJob Burstable
    requests:
      # Setting a higher CPU request helps with the Job runtime. If you don't
      # care about job execution speed and want to save on resources, feel free
      # to lower this
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: 500m
      # Keep the memory limit sufficiently high.
      #
      # The updating CronJob runs an image that runs `helm upgrade`. It renders
      # the chart and that can require a lot of memory. If you don't want your
      # updating job to be OOM Killed, keep this at 256 MiB or higher depending
      # on the size of your cluster.
      memory: 256Mi

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
