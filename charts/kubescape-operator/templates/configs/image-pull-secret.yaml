{{- if include "kubescape-operator.createsPullSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecrets }}
  namespace: {{ .Values.ksNamespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "kubescape-operator.dockerconfigjson" . }}
{{- end }}