{{- if and .Values.nodeAgent.directAlerts.enabled .Values.nodeAgent.directAlerts.keygen.enabled }}
{{- $consumerNs := default .Values.ksNamespace .Values.nodeAgent.directAlerts.consumerNamespace }}
apiVersion: batch/v1
kind: Job
metadata:
  name: node-agent-direct-keygen
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" "node-agent-direct-keygen" "tier" .Values.global.namespaceTier) | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "kubescape-operator.podLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" "node-agent-direct-keygen" "tier" .Values.global.namespaceTier) | nindent 8 }}
    spec:
      serviceAccountName: node-agent-direct-keygen
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: keygen
          image: {{ .Values.certificates.certgen.image.repository }}:{{ .Values.certificates.certgen.image.tag }}
          imagePullPolicy: {{ .Values.certificates.certgen.image.pullPolicy }}
          command: ["/scripts/direct-keygen.sh"]
          env:
            - name: PUB_NS
              value: {{ .Values.ksNamespace | quote }}
            - name: PRIV_NS
              value: {{ $consumerNs | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: scripts
          configMap:
            name: node-agent-direct-keygen
            defaultMode: 0755
        - name: tmp
          emptyDir: {}
{{- end }}
