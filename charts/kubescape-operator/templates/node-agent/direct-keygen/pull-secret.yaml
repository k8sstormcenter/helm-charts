{{- if and .Values.nodeAgent.directAlerts.enabled .Values.nodeAgent.directAlerts.keygen.enabled (include "kubescape-operator.createsPullSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: node-agent-direct-keygen-pull
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.nodeAgent.name "tier" .Values.global.namespaceTier) | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "kubescape-operator.dockerconfigjson" . }}
{{- end }}
