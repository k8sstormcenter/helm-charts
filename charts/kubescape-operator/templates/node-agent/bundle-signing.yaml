{{- if .Values.nodeAgent.bundleSigning.enabled }}
# Signed-bundle overlays: per-class trust policy for fragment verification and
# the cluster key node-agent uses to re-sign assembled composites.
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-agent-bundle-policy
  namespace: {{ .Values.ksNamespace }}
  labels:
    kubescape.io/ignore: "true"
data:
  trust-policy.json: |
{{ .Values.nodeAgent.bundleSigning.trustPolicy | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: node-agent-bundle-key
  namespace: {{ .Values.ksNamespace }}
  labels:
    kubescape.io/ignore: "true"
type: Opaque
stringData:
  signing-key.pem: |
{{ .Values.nodeAgent.bundleSigning.signingKey | indent 4 }}
{{- end }}
