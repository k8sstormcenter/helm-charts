{{- if .Values.nodeAgent.bundleSigning.enabled }}
# Signed-bundle overlays: per-class trust policy (public-key fingerprints) that
# node-agent uses to VERIFY fragment signatures. No signing key is deployed to
# the cluster — node-agent never signs, it only verifies.
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-agent-bundle-policy
  namespace: {{ .Values.ksNamespace }}
  labels:
    kubescape.io/ignore: "true"
data:
  trust-policy.json: |
{{ .Values.nodeAgent.bundleSigning.trustPolicy | indent 4 }}
{{- end }}
