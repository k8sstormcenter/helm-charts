suite: node-agent direct-alerts keygen pulls its image before the chart's objects exist
templates:
  - node-agent/direct-keygen/job.yaml
  - node-agent/direct-keygen/pull-secret.yaml
  - configs/image-pull-secret.yaml
capabilities:
  apiVersions:
    - batch/v1
tests:
  - it: gives the keygen hook its own copy of the chart's pull secret, created ahead of the job
    template: node-agent/direct-keygen/pull-secret.yaml
    set:
      unittest: true
      clusterName: kind-kind
      imagePullSecrets: regcred
      imagePullSecret:
        server: registry.example.com
        username: puller
        password: s3cret
        email: ops@example.com
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: node-agent-direct-keygen-pull
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6InB1bGxlciIsInBhc3N3b3JkIjoiczNjcmV0IiwiZW1haWwiOiJvcHNAZXhhbXBsZS5jb20iLCJhdXRoIjoiY0hWc2JHVnlPbk16WTNKbGRBPT0ifX19
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  - it: keeps the chart's own pull secret an ordinary object with the same credentials
    template: configs/image-pull-secret.yaml
    set:
      unittest: true
      clusterName: kind-kind
      imagePullSecrets: regcred
      imagePullSecret:
        server: registry.example.com
        username: puller
        password: s3cret
        email: ops@example.com
    asserts:
      - equal:
          path: metadata.name
          value: regcred
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6InB1bGxlciIsInBhc3N3b3JkIjoiczNjcmV0IiwiZW1haWwiOiJvcHNAZXhhbXBsZS5jb20iLCJhdXRoIjoiY0hWc2JHVnlPbk16WTNKbGRBPT0ifX19
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: pulls the keygen image with the hook's copy when the chart creates the pull secret
    template: node-agent/direct-keygen/job.yaml
    set:
      unittest: true
      clusterName: kind-kind
      imagePullSecrets: regcred
      imagePullSecret:
        server: registry.example.com
        username: puller
        password: s3cret
        email: ops@example.com
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: node-agent-direct-keygen-pull

  - it: pulls the keygen image with a pull secret the operator created beforehand
    template: node-agent/direct-keygen/job.yaml
    set:
      unittest: true
      clusterName: kind-kind
      imagePullSecrets: regcred
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: regcred

  - it: accepts a list of pull secrets the operator created beforehand
    template: node-agent/direct-keygen/job.yaml
    set:
      unittest: true
      clusterName: kind-kind
      imagePullSecrets: [foo, bar]
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: foo
            - name: bar

  - it: renders no copy without chart-managed credentials
    template: node-agent/direct-keygen/pull-secret.yaml
    set:
      unittest: true
      clusterName: kind-kind
      imagePullSecrets: regcred
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no pull secrets on the job when none are configured
    template: node-agent/direct-keygen/job.yaml
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
