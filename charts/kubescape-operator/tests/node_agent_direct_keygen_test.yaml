suite: node-agent direct-alerts keygen job
templates:
  - node-agent/direct-keygen/job.yaml
capabilities:
  apiVersions:
    - batch/v1
tests:
  - it: removes the completed keygen job so a repeated apply never updates an immutable template
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
      - isNotNullOrEmpty:
          path: spec.ttlSecondsAfterFinished

  - it: lets the operator choose how long the completed keygen job stays
    set:
      unittest: true
      clusterName: kind-kind
      nodeAgent.directAlerts.keygen.ttlSecondsAfterFinished: 30
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 30

  - it: renders no keygen job when key generation is turned off
    set:
      unittest: true
      clusterName: kind-kind
      nodeAgent.directAlerts.keygen.enabled: false
    asserts:
      - hasDocuments:
          count: 0
