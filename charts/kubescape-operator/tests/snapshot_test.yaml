    template: templates/operator/clusterrole.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      capabilities:
        remediation: enable
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments", "statefulsets", "daemonsets"]
