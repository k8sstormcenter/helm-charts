suite: Snapshot tests
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - kind: Secret
      apiVersion: v1
      metadata:
        name: extra-certificates
        namespace: kubescape
      data:
        cert1.pem: Zm9v
        cert2.pem: Zm9v
tests:
  - it: all capabilities
    asserts:
      - matchSnapshot: {}
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      account: 9e6c0c2c-6bd0-4919-815b-55030de7c9a0
      accessKey: f304d73b-d43c-412b-82ea-e4c859493ce6
      alertCRD:
        installDefault: true
      capabilities:
        runtimeObservability: enable
        networkPolicyService: enable
        runtimeDetection: enable
        httpDetection: enable
        malwareDetection: enable
        nodeProfileService: enable
        nodeSbomGeneration: enable
        scanEmbeddedSBOMs: enable
        seccompProfileService: enable
        autoUpgrading: enable
        admissionController: enable
        manageWorkloads: enable
        networkEventsStreaming: enable
        syncSBOM: enable
        remediation: enable
      excludeLabels:
        foo: [bar, baz]
        baz: [qux]
      server: api.armosec.io
      configurations:
        otelUrl: "otelCollector.svc.monitoring:4317"
        excludeJsonPaths:
          - '.containers[*].env[?(@.name=="KUBECONFIG")]'
      clusterName: kind-kind
      includeNamespaces: "my-namespace"
      global:
        httpsProxy: "https://foo:bar@baz:1234"
        noProxy: "*.foo,bar.baz"
        networkPolicy:
          createEgressRules: true
          enabled: true
          apiServerPort: 443
          httpsProxyIP: 1.1.1.1
          httpsProxyPort: 1234
        proxySecretFile: foo
        overrideDefaultCaCertificates:
          enabled: true
          caCertificates: "foo"
        openshift:
          scc:
            enabled: true
      imagePullSecrets: [foo, bar]
      nodeAgent.gke.allowlist:
        enabled: true
        name: armo-kubescape-node-agent-1.27
      nodeAgent.config.skipKernelVersionCheck: true
      storage.forceVirtualCrds: true
      storage.mtls.enabled: false
  - it: minimal capabilities
    asserts:
      - matchSnapshot: {}
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      configurations.otelUrl: "otelCollector.svc.monitoring:4317"
      clusterName: kind-kind
      excludeNamespaces: ""
      includeNamespaces: ""
  - it: disable otel
    asserts:
      - matchSnapshot: {}
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      account: 9e6c0c2c-6bd0-4919-815b-55030de7c9a0
      accessKey: f304d73b-d43c-412b-82ea-e4c859493ce6
      clusterName: kind-kind
      server: api.armosec.io
  - it: default capabilities
    asserts:
      - matchSnapshot: {}
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      account: 9e6c0c2c-6bd0-4919-815b-55030de7c9a0
      accessKey: f304d73b-d43c-412b-82ea-e4c859493ce6
      alertCRD:
        installDefault: true
      capabilities:
        runtimeObservability: enable
        networkPolicyService: enable
        runtimeDetection: disable
        httpDetection: disable
        malwareDetection: disable
        nodeProfileService: disable
        autoUpgrading: disable
        admissionController: disable
      server: api.armosec.io
      clusterName: kind-kind
      excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease,kubeconfig,gmp-system,gmp-public"
      global:
        extraCaCertificates:
          enabled: true
          secretName: "extra-certificates"
        networkPolicy:
          createEgressRules: true
          enabled: true
          apiServerIP: "192.168.49.2"
          apiServerPort: 8443
        proxySecretFile: foo
  - it: storage service configuration
    template: storage/service.yaml
    documentSelector:
      path: metadata.name
      value: storage
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      storage.service.type: LoadBalancer
      storage.service.annotations:
        io.cilium/lb-ipam-ips: 10.103.145.148
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: metadata.annotations["io.cilium/lb-ipam-ips"]
          value: 10.103.145.148
  - it: sbom scanner gets otel endpoint and downward-API telemetry env
    template: node-agent/daemonset.yaml
    documentSelector:
      path: metadata.name
      value: node-agent
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      configurations.otelUrl: "signoz-otel-collector.signoz.svc.cluster.local:4317"
      capabilities.runtimeObservability: enable
      nodeAgent.sbomScanner.enabled: true
      capabilities.nodeSbomGeneration: enable
    asserts:
      # containers[0] is the sbom-scanner sidecar
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_COLLECTOR_SVC
            value: signoz-otel-collector.signoz.svc.cluster.local:4317
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLUSTER_NAME
            value: kind-kind
  - it: node-agent sbom scanner sidecar mounts custom, extra and proxy CA certificates
    template: node-agent/daemonset.yaml
    documentSelector:
      path: metadata.name
      value: node-agent
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      nodeAgent.sbomScanner.enabled: true
      capabilities.nodeSbomGeneration: enable
      global:
        proxySecretFile: foo
        overrideDefaultCaCertificates:
          enabled: true
        extraCaCertificates:
          enabled: true
          secretName: "extra-certificates"
    asserts:
      # containers[0] is the sbom-scanner sidecar
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: proxy-secret
            mountPath: /etc/ssl/certs/proxy.crt
            subPath: proxy.crt
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-ca-certificates
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-ca-certificates
            mountPath: /etc/ssl/certs/cert1.pem
            subPath: cert1.pem
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-ca-certificates
            mountPath: /etc/ssl/certs/cert2.pem
            subPath: cert2.pem
            readOnly: true
  - it: node-agent egress allows OTLP ports when otelUrl is set
    template: node-agent/networkpolicy.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.runtimeObservability: enable
      configurations.otelUrl: "signoz-otel-collector.signoz.svc.cluster.local:4317"
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 4317
                protocol: TCP
              - port: 4318
                protocol: TCP
  - it: node-agent egress omits OTLP ports when otelUrl is unset
    template: node-agent/networkpolicy.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.runtimeObservability: enable
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
    asserts:
      - notContains:
          path: spec.egress
          content:
            ports:
              - port: 4317
                protocol: TCP
              - port: 4318
                protocol: TCP
  - it: with image pull secret generated
    template: configs/image-pull-secret.yaml
    documentSelector:
      path: metadata.name
      value: quay-secret
    asserts:
      - equal:
          path: metadata.name
          value: quay-secret
      - matchSnapshot: {}
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      configurations.otelUrl: "otelCollector.svc.monitoring:4317"
      clusterName: kind-kind
      imagePullSecrets: quay-secret
      imagePullSecret:
        server: quay.io
        username: foo
        password: xxxxxxx
  - it: multiple node agents
    asserts:
      - matchSnapshot: {}
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      account: 9e6c0c2c-6bd0-4919-815b-55030de7c9a0
      accessKey: f304d73b-d43c-412b-82ea-e4c859493ce6
      alertCRD:
        installDefault: true
      capabilities:
        runtimeObservability: enable
        networkPolicyService: enable
        runtimeDetection: enable
        httpDetection: enable
        malwareDetection: enable
        nodeProfileService: enable
        nodeSbomGeneration: enable
        scanEmbeddedSBOMs: enable
        seccompProfileService: enable
        autoUpgrading: enable
        admissionController: enable
        manageWorkloads: enable
        networkEventsStreaming: enable
        syncSBOM: enable
        remediation: enable
      excludeLabels:
        foo: [bar, baz]
        baz: [qux]
      server: api.armosec.io
      configurations:
        otelUrl: "otelCollector.svc.monitoring:4317"
        excludeJsonPaths:
          - '.containers[*].env[?(@.name=="KUBECONFIG")]'
      clusterName: kind-kind
      includeNamespaces: "my-namespace"
      global:
        httpsProxy: "https://foo:bar@baz:1234"
        noProxy: "*.foo,bar.baz"
        networkPolicy:
          createEgressRules: true
          enabled: true
          apiServerPort: 443
          httpsProxyIP: 1.1.1.1
          httpsProxyPort: 1234
        proxySecretFile: foo
        overrideDefaultCaCertificates:
          enabled: true
          caCertificates: "foo"
        openshift:
          scc:
            enabled: true
      imagePullSecrets: [foo, bar]
      nodeAgent.gke.allowlist:
        enabled: true
        name: armo-kubescape-node-agent-1.27
      nodeAgent.multipleDaemonSets:
        enabled: true # set to true to enable multiple DaemonSets for the node-agent, with different configurations.
        configurations:
          - nodeSelector:
              kubernetes.io/os: linux
              doks.digitalocean.com/node-pool: pool-1
            resources:
              requests:
                cpu: 300m
                memory: 128Mi
              limits:
                cpu: 400m
                memory: 512Mi
          - nodeSelector:
              kubernetes.io/os: linux
              doks.digitalocean.com/node-pool: pool-2
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 200m
                memory: 512Mi
      nodeAgent.config.skipKernelVersionCheck: true
      storage.forceVirtualCrds: true
      storage.mtls.enabled: false
  - it: backend-storage enabled allows scanning capabilities
    asserts:
      - matchSnapshot: {}
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      account: 9e6c0c2c-6bd0-4919-815b-55030de7c9a0
      accessKey: f304d73b-d43c-412b-82ea-e4c859493ce6
      alertCRD:
        installDefault: true
      capabilities:
        backend-storage: enable
        runtimeObservability: enable
        networkPolicyService: enable
        nodeProfileService: enable
      server: api.armosec.io
      clusterName: kind-kind
      excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease"
  - it: priority class scheduling
    asserts:
      - matchSnapshot: {}
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      account: 9e6c0c2c-6bd0-4919-815b-55030de7c9a0
      accessKey: f304d73b-d43c-412b-82ea-e4c859493ce6
      server: api.armosec.io
      clusterName: kind-kind
      capabilities:
        runtimeDetection: enable
      # global fallback for all deployments
      customScheduling:
        priorityClassName: "global-priority"
      # node-agent override takes precedence over configurations.priorityClass (kubescape-critical)
      nodeAgent:
        priorityClassName: "node-agent-priority"
